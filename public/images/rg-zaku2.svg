<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <pattern id="grid-rg" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#0d766e" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow-rg" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#0d766e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0d766e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="28" fill="#e8f5f3"/>
  <rect width="400" height="400" rx="28" fill="url(#grid-rg)"/>
  <circle cx="200" cy="168" r="150" fill="url(#glow-rg)"/>

  <!-- shoulders (rounded pauldrons) -->
  <circle cx="105" cy="320" r="55" fill="#b91c1c"/>
  <circle cx="295" cy="320" r="55" fill="#b91c1c"/>

  <!-- chest -->
  <polygon points="150,235 250,235 262,320 138,320" fill="#374151"/>
  <polygon points="150,235 250,235 240,270 160,270" fill="#4b5563"/>

  <!-- neck -->
  <rect x="188" y="200" width="24" height="38" fill="#374151"/>

  <!-- head (rounded, no antenna) -->
  <ellipse cx="200" cy="152" rx="58" ry="46" fill="#dfe3e8"/>
  <ellipse cx="200" cy="152" rx="58" ry="46" fill="none" stroke="#374151" stroke-width="4"/>

  <!-- monoeye slit -->
  <rect x="150" y="146" width="100" height="12" rx="6" fill="#b91c1c"/>
  <circle cx="200" cy="152" r="9" fill="#fca5a5"/>

  <!-- top vents -->
  <rect x="180" y="106" width="40" height="10" rx="3" fill="#374151"/>

  <!-- accent vents -->
  <rect x="120" y="330" width="30" height="8" rx="2" fill="#eab308"/>
  <rect x="250" y="330" width="30" height="8" rx="2" fill="#eab308"/>
</svg>
