  <polygon points="288,120 330,90 304,140" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>

  <!-- visor: gold Zero visor -->
  <rect x="140" y="165" width="120" height="24" rx="10" fill="#eab308"/>
  <circle cx="170" cy="177" r="6" fill="#fef9c3"/>
  <circle cx="230" cy="177" r="6" fill="#fef9c3"/>

  <!-- forehead vent -->
