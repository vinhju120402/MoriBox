    </pattern>
    <radialGradient id="glow-acc4" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#4b5563" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4b5563" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="28" fill="#eef0f2"/>
  <rect width="400" height="400" rx="28" fill="url(#grid-acc4)"/>
  <circle cx="200" cy="200" r="150" fill="url(#glow-acc4)"/>

  <!-- base platform -->
