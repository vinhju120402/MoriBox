<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <pattern id="grid-acc1" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#4b5563" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow-acc1" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#4b5563" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4b5563" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="28" fill="#eef0f2"/>
  <rect width="400" height="400" rx="28" fill="url(#grid-acc1)"/>
  <circle cx="200" cy="200" r="150" fill="url(#glow-acc1)"/>

  <!-- base -->
  <ellipse cx="200" cy="300" rx="95" ry="22" fill="#4b5563"/>
  <ellipse cx="200" cy="294" rx="95" ry="22" fill="#6b7280"/>
  <ellipse cx="200" cy="294" rx="65" ry="13" fill="#e5e7eb" opacity="0.5"/>

  <!-- pole -->
  <rect x="192" y="150" width="16" height="150" rx="4" fill="#94a3b8"/>

  <!-- clip / clear support arm -->
  <path d="M208 190 C 250 190, 250 150, 220 150" fill="none" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>

  <!-- ghost mecha silhouette being displayed -->
  <g opacity="0.85">
    <polygon points="180,90 220,90 230,110 220,132 180,132 170,110" fill="#cbd5e1"/>
    <polygon points="150,150 250,150 258,190 142,190" fill="#cbd5e1"/>
    <rect x="150" y="190" width="100" height="14" rx="4" fill="#9ca3af"/>
  </g>

  <!-- rotation arrows (360°) -->
  <path d="M120 300 A 80 80 0 0 1 145 245" fill="none" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
  <polygon points="140,238 152,248 132,256" fill="#4b5563"/>
  <path d="M280 300 A 80 80 0 0 0 255 245" fill="none" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
  <polygon points="260,238 248,248 268,256" fill="#4b5563"/>
</svg>
