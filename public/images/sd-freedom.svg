<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <pattern id="grid-sd1" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#a8326b" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow-sd1" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#a8326b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a8326b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="28" fill="#f9eef3"/>
  <rect width="400" height="400" rx="28" fill="url(#grid-sd1)"/>
  <circle cx="200" cy="190" r="150" fill="url(#glow-sd1)"/>

  <!-- wings -->
  <polygon points="130,220 40,170 60,220 40,270 130,250" fill="#e2e8f0"/>
  <polygon points="270,220 360,170 340,220 360,270 270,250" fill="#e2e8f0"/>
  <polygon points="130,220 40,170 60,220 40,270 130,250" fill="none" stroke="#dc2626" stroke-width="3"/>
  <polygon points="270,220 360,170 340,220 360,270 270,250" fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- small body -->
  <rect x="160" y="270" width="80" height="60" rx="16" fill="#f3f4f6" stroke="#94a3b8" stroke-width="3"/>
  <rect x="176" y="278" width="48" height="20" rx="6" fill="#dc2626"/>

  <!-- stubby legs -->
  <rect x="168" y="326" width="26" height="24" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="206" y="326" width="26" height="24" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>

  <!-- big chibi head -->
  <ellipse cx="200" cy="170" rx="105" ry="95" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>

  <!-- twin fin antenna -->
  <polygon points="112,120 70,90 96,140" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="288,120 330,90 304,140" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>

  <!-- visor: Freedom's signature green eyes -->
  <rect x="140" y="165" width="120" height="24" rx="10" fill="#22c55e"/>
  <circle cx="170" cy="177" r="6" fill="#dcfce7"/>
  <circle cx="230" cy="177" r="6" fill="#dcfce7"/>

  <!-- forehead vent -->
  <rect x="185" y="112" width="30" height="10" rx="3" fill="#dc2626"/>
</svg>
