<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <pattern id="grid-mg" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#475569" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow-mg" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="28" fill="#eef1f4"/>
  <rect width="400" height="400" rx="28" fill="url(#grid-mg)"/>
  <circle cx="200" cy="168" r="150" fill="url(#glow-mg)"/>

  <!-- wing blades -->
  <polygon points="150,260 40,190 60,260 40,320 150,300" fill="#475569" opacity="0.85"/>
  <polygon points="250,260 360,190 340,260 360,320 250,300" fill="#475569" opacity="0.85"/>
  <polygon points="150,260 70,220 82,268 70,308 150,300" fill="#1d4ed8" opacity="0.7"/>
  <polygon points="250,260 330,220 318,268 330,308 250,300" fill="#1d4ed8" opacity="0.7"/>

  <!-- shoulders -->
  <polygon points="80,300 152,272 158,360 72,372" fill="#475569"/>
  <polygon points="320,300 248,272 242,360 328,372" fill="#475569"/>

  <!-- chest -->
  <polygon points="150,235 250,235 262,320 138,320" fill="#5b6b80"/>
  <polygon points="150,235 250,235 240,270 160,270" fill="#1d4ed8"/>

  <!-- neck -->
  <rect x="188" y="200" width="24" height="38" fill="#475569"/>

  <!-- head -->
  <polygon points="165,120 235,120 250,150 235,182 165,182 150,150" fill="#f1f5f9"/>
  <polygon points="165,120 235,120 250,150 235,182 165,182 150,150" fill="none" stroke="#475569" stroke-width="4"/>

  <!-- twin fin antenna -->
  <polygon points="150,150 112,124 130,158" fill="#f1f5f9" stroke="#475569" stroke-width="3"/>
  <polygon points="250,150 288,124 270,158" fill="#f1f5f9" stroke="#475569" stroke-width="3"/>

  <!-- visor -->
  <rect x="172" y="142" width="56" height="14" rx="6" fill="#1d4ed8" opacity="0.85"/>

  <!-- accent vents -->
  <rect x="120" y="330" width="30" height="8" rx="2" fill="#eab308"/>
  <rect x="250" y="330" width="30" height="8" rx="2" fill="#eab308"/>
</svg>
