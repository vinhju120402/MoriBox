<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <pattern id="grid-eg1" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2f6690" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow-eg1" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#2f6690" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2f6690" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="28" fill="#eaf2f7"/>
  <rect width="400" height="400" rx="28" fill="url(#grid-eg1)"/>
  <circle cx="200" cy="168" r="150" fill="url(#glow-eg1)"/>

  <!-- shield -->
  <polygon points="70,240 130,225 138,330 78,345 55,300" fill="#dc2626"/>
  <polygon points="70,240 130,225 138,330 78,345 55,300" fill="none" stroke="#7f1d1d" stroke-width="3"/>

  <!-- shoulders -->
  <polygon points="105,300 165,275 170,360 98,372" fill="#f3f4f6" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="295,300 235,275 230,360 302,372" fill="#f3f4f6" stroke="#94a3b8" stroke-width="3"/>

  <!-- chest -->
  <polygon points="150,235 250,235 262,320 138,320" fill="#f3f4f6"/>
  <polygon points="150,235 250,235 240,270 160,270" fill="#1e40af"/>

  <!-- neck -->
  <rect x="188" y="200" width="24" height="38" fill="#cbd5e1"/>

  <!-- head -->
  <polygon points="165,120 235,120 250,150 235,182 165,182 150,150" fill="#f3f4f6"/>
  <polygon points="165,120 235,120 250,150 235,182 165,182 150,150" fill="none" stroke="#1e40af" stroke-width="4"/>

  <!-- twin fin antenna -->
  <polygon points="150,150 118,132 134,158" fill="#f3f4f6" stroke="#1e40af" stroke-width="3"/>
  <polygon points="250,150 282,132 266,158" fill="#f3f4f6" stroke="#1e40af" stroke-width="3"/>

  <!-- visor -->
  <rect x="172" y="142" width="56" height="14" rx="6" fill="#22c55e" opacity="0.85"/>

  <!-- accent vents -->
  <rect x="150" y="330" width="30" height="8" rx="2" fill="#eab308"/>
  <rect x="220" y="330" width="30" height="8" rx="2" fill="#eab308"/>
</svg>
