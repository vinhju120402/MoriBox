<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <pattern id="grid-acc2" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#4b5563" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow-acc2" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#4b5563" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4b5563" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="28" fill="#eef0f2"/>
  <rect width="400" height="400" rx="28" fill="url(#grid-acc2)"/>
  <circle cx="200" cy="200" r="150" fill="url(#glow-acc2)"/>

  <!-- toolbox body -->
  <rect x="95" y="210" width="210" height="110" rx="14" fill="#4b5563"/>
  <rect x="95" y="210" width="210" height="110" rx="14" fill="none" stroke="#374151" stroke-width="4"/>
  <rect x="95" y="238" width="210" height="14" fill="#374151"/>
  <rect x="175" y="185" width="50" height="34" rx="8" fill="none" stroke="#4b5563" stroke-width="10"/>
  <rect x="190" y="265" width="20" height="30" rx="4" fill="#e5e7eb"/>

  <!-- side cutter (nippers) -->
  <g transform="rotate(-18 145 165)">
    <rect x="130" y="90" width="10" height="90" rx="4" fill="#dc2626"/>
    <rect x="152" y="90" width="10" height="90" rx="4" fill="#dc2626"/>
    <polygon points="130,175 140,185 150,175 140,160" fill="#9ca3af"/>
    <polygon points="152,175 162,185 172,175 162,160" fill="#9ca3af"/>
  </g>

  <!-- tweezers -->
  <g transform="rotate(16 265 160)">
    <polygon points="255,90 262,90 270,175 258,180 246,175" fill="#94a3b8"/>
  </g>

  <!-- screwdriver -->
  <g transform="rotate(4 205 150)">
    <rect x="198" y="80" width="14" height="70" rx="4" fill="#eab308"/>
    <rect x="196" y="145" width="18" height="18" rx="3" fill="#9ca3af"/>
  </g>
</svg>
